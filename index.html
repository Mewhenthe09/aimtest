<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aim.</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f6f3;
    --fg: #1a1a1a;
    --muted: #9a9690;
    --accent: #e84c3d;
    --border: #e2e0db;
    --target: #1a1a1a;
    --hit: #e84c3d;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    cursor: crosshair;
  }

  /* HEADER */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    border-bottom: 1px solid var(--border);
    z-index: 100;
    background: var(--bg);
  }

  .logo {
    font-family: 'DM Mono', monospace;
    font-size: 18px;
    letter-spacing: -0.5px;
    font-weight: 400;
  }

  .stats {
    display: flex;
    gap: 40px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--muted);
  }

  .stat-item { text-align: right; }
  .stat-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 1px; }
  .stat-value {
    font-size: 18px;
    color: var(--fg);
    font-weight: 400;
    transition: color 0.15s;
  }
  .stat-value.flash { color: var(--accent); }

  /* ARENA */
  #arena {
    position: fixed;
    top: 56px; left: 0; right: 0; bottom: 0;
  }

  /* TARGETS */
  .target {
    position: absolute;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    cursor: crosshair;
    transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
    will-change: transform;
  }

  .target.visible {
    transform: translate(-50%, -50%) scale(1);
  }

  .target::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--target);
    opacity: 1;
    transition: opacity 0.08s;
  }

  .target::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 30%;
    height: 30%;
    border-radius: 50%;
    background: var(--bg);
    pointer-events: none;
  }

  .target.hit::before { background: var(--accent); }

  .target.shrink {
    animation: shrink 0.15s ease-in forwards;
  }

  @keyframes shrink {
    to { transform: translate(-50%, -50%) scale(0); opacity: 0; }
  }

  /* RIPPLE */
  .ripple {
    position: absolute;
    border-radius: 50%;
    border: 1.5px solid var(--accent);
    transform: translate(-50%, -50%) scale(0);
    opacity: 1;
    animation: ripple-out 0.5s ease-out forwards;
    pointer-events: none;
  }

  @keyframes ripple-out {
    to { transform: translate(-50%, -50%) scale(3); opacity: 0; }
  }

  /* MISS FLASH */
  #miss-flash {
    position: fixed;
    inset: 0;
    background: var(--accent);
    opacity: 0;
    pointer-events: none;
    z-index: 50;
    transition: opacity 0.05s;
  }
  #miss-flash.show { opacity: 0.04; }

  /* TIMER BAR */
  #timer-bar-container {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: var(--border);
    z-index: 100;
  }
  #timer-bar {
    height: 100%;
    background: var(--fg);
    width: 100%;
    transition: width 0.1s linear, background 0.3s;
  }
  #timer-bar.warning { background: var(--accent); }

  /* OVERLAY */
  .overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 200;
    gap: 0;
  }

  .overlay h1 {
    font-family: 'DM Mono', monospace;
    font-size: clamp(48px, 8vw, 96px);
    font-weight: 300;
    letter-spacing: -3px;
    line-height: 1;
    margin-bottom: 16px;
  }

  .overlay p {
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 0.05em;
    margin-bottom: 48px;
  }

  .btn {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 14px 40px;
    border: 1.5px solid var(--fg);
    background: transparent;
    color: var(--fg);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .btn:hover { background: var(--fg); color: var(--bg); }

  /* RESULTS */
  .results-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    margin-bottom: 40px;
    width: min(480px, 90vw);
  }

  .result-cell {
    background: var(--bg);
    padding: 24px 20px;
    text-align: center;
  }

  .result-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    font-family: 'DM Mono', monospace;
  }

  .result-value {
    font-family: 'DM Mono', monospace;
    font-size: 28px;
    font-weight: 400;
    color: var(--fg);
  }

  .result-value.highlight { color: var(--accent); }

  .hidden { display: none !important; }

  /* DIFFICULTY */
  .difficulty-row {
    display: flex;
    gap: 12px;
    margin-bottom: 40px;
  }

  .diff-btn {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 8px 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .diff-btn:hover, .diff-btn.active {
    border-color: var(--fg);
    color: var(--fg);
  }
  .diff-btn.active { background: var(--fg); color: var(--bg); }
</style>
</head>
<body>

<div id="miss-flash"></div>

<!-- HEADER -->
<header>
  <div class="logo">aim.</div>
  <div class="stats">
    <div class="stat-item">
      <div class="stat-label">hits</div>
      <div class="stat-value" id="hits-display">0</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">misses</div>
      <div class="stat-value" id="misses-display">0</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">accuracy</div>
      <div class="stat-value" id="accuracy-display">—</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">avg ms</div>
      <div class="stat-value" id="reaction-display">—</div>
    </div>
    <div class="stat-item">
      <div class="stat-label">time</div>
      <div class="stat-value" id="time-display">30</div>
    </div>
  </div>
</header>

<!-- ARENA -->
<div id="arena"></div>

<!-- TIMER BAR -->
<div id="timer-bar-container">
  <div id="timer-bar"></div>
</div>

<!-- START OVERLAY -->
<div class="overlay" id="start-overlay">
  <h1>aim.</h1>
  <p>click targets as fast as you can</p>
  <div class="difficulty-row">
    <button class="diff-btn" data-diff="easy">easy</button>
    <button class="diff-btn active" data-diff="medium">medium</button>
    <button class="diff-btn" data-diff="hard">hard</button>
  </div>
  <button class="btn" id="start-btn">start</button>
</div>

<!-- RESULTS OVERLAY -->
<div class="overlay hidden" id="results-overlay">
  <h1 id="result-heading">—</h1>
  <div class="results-grid">
    <div class="result-cell">
      <div class="result-label">hits</div>
      <div class="result-value" id="r-hits">0</div>
    </div>
    <div class="result-cell">
      <div class="result-label">misses</div>
      <div class="result-value" id="r-misses">0</div>
    </div>
    <div class="result-cell">
      <div class="result-label">accuracy</div>
      <div class="result-value highlight" id="r-accuracy">0%</div>
    </div>
    <div class="result-cell">
      <div class="result-label">avg react.</div>
      <div class="result-value" id="r-reaction">—</div>
    </div>
    <div class="result-cell">
      <div class="result-label">best react.</div>
      <div class="result-value" id="r-best">—</div>
    </div>
    <div class="result-cell">
      <div class="result-label">score</div>
      <div class="result-value highlight" id="r-score">0</div>
    </div>
  </div>
  <button class="btn" id="retry-btn">try again</button>
</div>

<script>
  const DIFFICULTY = {
    easy:   { duration: 30, minSize: 50, maxSize: 80, spawnRate: 1200, maxTargets: 3 },
    medium: { duration: 30, minSize: 36, maxSize: 58, spawnRate: 900,  maxTargets: 4 },
    hard:   { duration: 30, minSize: 24, maxSize: 42, spawnRate: 650,  maxTargets: 5 },
  };

  let diff = 'medium';
  let hits = 0, misses = 0, reactionTimes = [];
  let gameRunning = false;
  let gameTimer, spawnTimer, countdownInterval;
  let timeLeft = 30;
  let targets = [];

  const arena = document.getElementById('arena');
  const startOverlay = document.getElementById('start-overlay');
  const resultsOverlay = document.getElementById('results-overlay');
  const hitsDisplay = document.getElementById('hits-display');
  const missesDisplay = document.getElementById('misses-display');
  const accuracyDisplay = document.getElementById('accuracy-display');
  const reactionDisplay = document.getElementById('reaction-display');
  const timeDisplay = document.getElementById('time-display');
  const timerBar = document.getElementById('timer-bar');
  const missFlash = document.getElementById('miss-flash');

  // Difficulty buttons
  document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      diff = btn.dataset.diff;
    });
  });

  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('retry-btn').addEventListener('click', () => {
    resultsOverlay.classList.add('hidden');
    startOverlay.classList.remove('hidden');
  });

  function startGame() {
    const cfg = DIFFICULTY[diff];
    hits = 0; misses = 0; reactionTimes = [];
    timeLeft = cfg.duration;
    targets = [];
    arena.innerHTML = '';
    gameRunning = true;

    updateStats();
    timerBar.style.width = '100%';
    timerBar.classList.remove('warning');
    timeDisplay.textContent = timeLeft;

    startOverlay.classList.add('hidden');

    // Countdown interval
    countdownInterval = setInterval(() => {
      timeLeft--;
      timeDisplay.textContent = timeLeft;
      const pct = (timeLeft / cfg.duration) * 100;
      timerBar.style.width = pct + '%';
      if (timeLeft <= 10) timerBar.classList.add('warning');
      if (timeLeft <= 0) endGame();
    }, 1000);

    // Spawn targets
    spawnTarget();
    spawnTimer = setInterval(() => {
      if (targets.length < cfg.maxTargets) spawnTarget();
    }, cfg.spawnRate);

    // Miss clicks on arena
    arena.addEventListener('click', onArenaMiss);
  }

  function spawnTarget() {
    if (!gameRunning) return;
    const cfg = DIFFICULTY[diff];
    const size = Math.random() * (cfg.maxSize - cfg.minSize) + cfg.minSize;
    const padding = size;
    const x = padding + Math.random() * (arena.clientWidth - padding * 2);
    const y = padding + Math.random() * (arena.clientHeight - padding * 2);

    const el = document.createElement('div');
    el.className = 'target';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.left = x + 'px';
    el.style.top = y + 'px';

    const spawnTime = performance.now();

    el.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!gameRunning) return;
      hitTarget(el, spawnTime);
    });

    arena.appendChild(el);
    targets.push(el);

    requestAnimationFrame(() => {
      requestAnimationFrame(() => el.classList.add('visible'));
    });
  }

  function hitTarget(el, spawnTime) {
    const rt = Math.round(performance.now() - spawnTime);
    reactionTimes.push(rt);
    hits++;

    el.classList.add('hit');
    el.classList.remove('visible');
    el.classList.add('shrink');

    // Ripple
    const ripple = document.createElement('div');
    ripple.className = 'ripple';
    ripple.style.left = el.style.left;
    ripple.style.top = el.style.top;
    ripple.style.width = el.style.width;
    ripple.style.height = el.style.height;
    arena.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);

    targets = targets.filter(t => t !== el);
    setTimeout(() => el.remove(), 200);

    flashStat('hits-display');
    updateStats();

    // Spawn new target
    setTimeout(spawnTarget, 100);
  }

  function onArenaMiss(e) {
    if (!gameRunning) return;
    if (e.target !== arena) return;
    misses++;
    missFlash.classList.add('show');
    setTimeout(() => missFlash.classList.remove('show'), 80);
    flashStat('misses-display');
    updateStats();
  }

  function flashStat(id) {
    const el = document.getElementById(id);
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 200);
  }

  function updateStats() {
    hitsDisplay.textContent = hits;
    missesDisplay.textContent = misses;
    const total = hits + misses;
    accuracyDisplay.textContent = total > 0 ? Math.round((hits / total) * 100) + '%' : '—';
    if (reactionTimes.length > 0) {
      const avg = Math.round(reactionTimes.reduce((a, b) => a + b, 0) / reactionTimes.length);
      reactionDisplay.textContent = avg;
    }
  }

  function endGame() {
    gameRunning = false;
    clearInterval(countdownInterval);
    clearInterval(spawnTimer);
    arena.removeEventListener('click', onArenaMiss);
    arena.innerHTML = '';
    targets = [];

    const total = hits + misses;
    const accuracy = total > 0 ? Math.round((hits / total) * 100) : 0;
    const avgRt = reactionTimes.length > 0
      ? Math.round(reactionTimes.reduce((a, b) => a + b, 0) / reactionTimes.length)
      : null;
    const bestRt = reactionTimes.length > 0 ? Math.min(...reactionTimes) : null;
    const score = Math.round(hits * (accuracy / 100) * (avgRt ? 1000 / avgRt : 1) * 100);

    // Heading based on accuracy
    const heading = accuracy >= 90 ? 'elite.' : accuracy >= 70 ? 'solid.' : accuracy >= 50 ? 'decent.' : 'keep going.';
    document.getElementById('result-heading').textContent = heading;

    document.getElementById('r-hits').textContent = hits;
    document.getElementById('r-misses').textContent = misses;
    document.getElementById('r-accuracy').textContent = accuracy + '%';
    document.getElementById('r-reaction').textContent = avgRt ? avgRt + 'ms' : '—';
    document.getElementById('r-best').textContent = bestRt ? bestRt + 'ms' : '—';
    document.getElementById('r-score').textContent = score;

    timerBar.style.width = '0%';
    resultsOverlay.classList.remove('hidden');
  }
</script>
</body>
</html>
